name: Build & Deploy Oppunks

on:
  workflow_dispatch:

jobs:
  Build_and_Deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    
    - name: Checkout branch
      uses: actions/checkout@v2

    - name: Setup node and npm
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - name: Docker login to Artifact Registry
      run: |
        echo "Logging in to Artifact Registry"
        docker login -u oauth2accesstoken -p ${{ secrets.CR_OAUTH_TOKEN }} europe-west6-docker.pkg.dev
    
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: europe-west6-docker.pkg.dev/namespace-439015/namespace-cr/oppunks:latest